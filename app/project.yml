# Project Midas iOS — xcodegen project.
#
# Copied from GoldenEye-Decomp-ios app/project.yml (55a3a9c8), round 9b:
# product ProjectMidas, libmidas.a from build-ios-{sim,device}/ at repo root,
# a ProjectMidas-visionos target since round 30 (bottom), GE_PUBLIC=1 by default (GEBridge is stubs);
# GE_DEV=1 scripts/build-ios.sh builds the dev bridge in. GEXbla (the XBLA
# import + texture packs) since round 16; it is what links the importer in.
#
# Division of labour (PD's D-009, inherited): CMake cross-builds the engine into
# build-ios-{sim,device}/libmidas.a (scripts/build-ios.sh); this project
# is only the bundle — the shell sources, the Info.plist, the ANGLE
# xcframeworks, the static SDL2, the signing and the OTA export. Regenerate
# with `xcodegen generate` from app/ (scripts/build-ios.sh does it); never edit
# the .xcodeproj, it is generated and gitignored.
#
# The per-configuration search paths are what select device vs simulator:
# $(PLATFORM_NAME) is iphoneos or iphonesimulator and the work/deps-* symlinks
# are named to match, while GE_SLICE picks the engine build dir.
name: ProjectMidas
options:
  bundleIdPrefix: com.rebelancap
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""   # device builds: scripts/build-ios.sh passes GE_TEAM_ID
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CLANG_ENABLE_OBJC_ARC: "YES"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Xcode 26+ otherwise links a Debug app as a stub plus a "debug dylib", and
    # the stub's entry point wants a main() that lives in the dylib:
    # "Undefined symbols: _main". Off, so Debug and Release link the same way
    # and a Debug .app is a real .app that simctl can install.
    ENABLE_DEBUG_DYLIB: "NO"
    # -Werror=int-conversion: charter/D-011 says pointer truncation is a build
    # failure, not a warning. The shell has no 32-bit-address code at all, so
    # it costs nothing today and catches the day it grows some.
    OTHER_CFLAGS: "-fno-strict-aliasing -Wno-deprecated-declarations -Werror=int-conversion"
    # Midas round 9b: GE_PUBLIC=1 by default, so GEBridge.m is three stubs and
    # an OTA build cannot ship the :8777 dev port. `GE_DEV=1
    # scripts/build-ios.sh` passes GE_PUBLIC_VALUE=0 for a simulator dev build
    # (the bridge's tap/drag drive the touch overlay; donor-only engine hooks
    # are weak no-op stubs in ios/GEBridgeMidas.m).
    GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) GE_PUBLIC=$(GE_PUBLIC_VALUE)"
    GE_PUBLIC_VALUE: "1"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/ios"
      - "$(SRCROOT)/../work/deps-$(PLATFORM_NAME)/include"
      - "$(SRCROOT)/../work/deps-$(PLATFORM_NAME)/include/SDL2"
    LIBRARY_SEARCH_PATHS:
      - "$(SRCROOT)/../work/deps-$(PLATFORM_NAME)/lib"
      - "$(SRCROOT)/../build-ios-$(GE_SLICE)"
targets:
  ProjectMidas:
    type: application
    platform: iOS
    sources:
      - path: ios/ge_ios_main.m
      - path: ios/GEShell.m
      - path: ios/GESceneDelegate.m
      - path: ios/GEPacing.m
      - path: ios/GEDefaults.m
      - path: ios/GEOnboarding.m
      - path: ios/GEInput.m
      - path: ios/GEController.m
      - path: ios/GETouchOverlay.m
      - path: ios/GETouchLayout.m
      - path: ios/GESettings.m
      - path: ios/GEAudio.m
      - path: ios/GEXbla.m
      # GEBridge compiles to three stubs when GE_PUBLIC=1 (see GEBridge.h): a
      # dev port has no business on a shipped build, so the whole
      # implementation goes, not just the listen().
      - path: ios/GEBridge.m
      - path: ios/GEBridgeMidas.m
      # The icon PNGs go in at the bundle ROOT (no group folder), which is
      # where CFBundleIconFiles looks for them. Placeholder art (D-028),
      # redrawn by scripts/make-app-icon.py.
      - path: ios/icon
        type: folder
        buildPhase: none
      - path: ios/icon/AppIcon60x60@2x.png
      - path: ios/icon/AppIcon60x60@3x.png
      - path: ios/icon/AppIcon76x76@2x.png
      - path: ios/icon/AppIcon83.5x83.5@2x.png
      - path: ios/icon/AppIcon1024.png
      # R9A-5: the four files the desktop build copies beside the exe. They
      # land at the bundle root; main.c's portRootFopen falls back to the
      # bundle, and the shell seeds gamecontrollerdefault.txt and
      # Data/shaders_base.txt into Documents (they are opened via
      # portRootPath, no fallback).
      - path: ../tools/gamecontrollerdb.txt
        buildPhase: resources
      - path: ../tools/gamecontrollerdefault.txt
        buildPhase: resources
      - path: ../tools/midas_ini_help.txt
        buildPhase: resources
      - path: ../tools/shaders_base.txt
        buildPhase: resources
    settings:
      base:
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.rebelancap.projectmidas
        PRODUCT_NAME: ProjectMidas
        INFOPLIST_FILE: ios/Info.plist
        # Versioning (~/dev/CLAUDE.md §Versioning): the ONE source of truth is
        # the repo's VERSION + DEV_ITERATION files, never a number typed here
        # and never one read back out of a built app (reading a version out of
        # an archive is how four wrong versions got published in this family).
        # scripts/gen-app-project.sh substitutes these two tokens into
        # app/project.generated.yml — which is what xcodegen actually reads —
        # so this file always carries the tokens, never a literal.
        MARKETING_VERSION: "GE_MARKETING_VERSION"
        CURRENT_PROJECT_VERSION: "GE_BUILD_NUMBER"
        # build-ios-sim vs build-ios-device, by the SDK in use.
        GE_SLICE: device
        GE_SLICE[sdk=iphonesimulator*]: sim
        # -lz for the SDK's zlib; SDL2main is NOT linked (the shell owns main()
        # and calls SDL_UIKitRunApp itself, which is all SDL2main would do).
        OTHER_LDFLAGS: "-lmidas -lSDL2 -lz -lc++"
    dependencies:
      - sdk: UIKit.framework
      # ANGLE supplies every gl* the renderer calls. OpenGLES.framework is
      # linked AFTER it, and only because SDL2's iOS backend still references
      # EAGL symbols; the linker searches in order, so the core gl* entry
      # points still bind to ANGLE (dhewm3-ios D-011, same arrangement — get
      # this order wrong and SDL's EAGL symbols win).
      - framework: ../work/angle-xcframeworks/libGLESv2.xcframework
        embed: true
        codeSign: true
      - framework: ../work/angle-xcframeworks/libEGL.xcframework
        embed: true
        codeSign: true
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMotion.framework
      - sdk: CoreBluetooth.framework
      - sdk: GameController.framework
      - sdk: Foundation.framework
      - sdk: UniformTypeIdentifiers.framework

  # ---- visionOS (Phase 5, round 30; GoldenEye-Decomp-ios round 37a D-340) ---
  # The SAME app: same bundle id, same shell sources (Midas's GEAudio,
  # GEXbla and GEBridgeMidas included), same engine, same ANGLE-Metal
  # substrate (perfect-dark-ios `perfectdark-visionos` is the family model).
  # Every shell difference is behind TARGET_OS_VISION (ios/GEVision.h); only
  # the platform settings, the Info.plist and the icon differ here. The iOS
  # target above is untouched (docs/port-ios/40-round30-visionos.md).
  ProjectMidas-visionos:
    type: application
    platform: visionOS
    sources:
      - path: ios/ge_ios_main.m
      - path: ios/GEShell.m
      - path: ios/GESceneDelegate.m
      - path: ios/GEPacing.m
      - path: ios/GEDefaults.m
      - path: ios/GEOnboarding.m
      - path: ios/GEInput.m
      - path: ios/GEController.m
      - path: ios/GETouchOverlay.m
      - path: ios/GETouchLayout.m
      - path: ios/GESettings.m
      - path: ios/GEAudio.m
      - path: ios/GEXbla.m
      - path: ios/GEBridge.m
      - path: ios/GEBridgeMidas.m
      # No icon PNGs here: a flat PNG is a BLANK tile on visionOS. The icon is
      # the layered .solidimagestack in this catalog (scripts/make-app-icon.py).
      - path: ios/Assets-visionos.xcassets
      # ---- Phase 6 (round 45, M1): the 3D mode, visionOS TARGET ONLY ---------
      # GEVisionApp.swift is this target's @main (an ImmersiveSpace can only be
      # declared by a SwiftUI App; docs/port-ios/64 §2.1, PD D-047), which is
      # why ge_ios_main.m's main() is #if !TARGET_OS_VISION. Every file here is
      # self-gated on TARGET_OS_VISION as well.
      - path: vision3d/GEVisionApp.swift
      - path: vision3d/GEHostViewController.m
      - path: vision3d/GEImmersive.m
      # Phase 6 M2 (round 46): the eye ring ANGLE renders into (EGLImage-wrapped
      # MTLTextures); compiled against ANGLE's own EGL/GLES headers below.
      - path: vision3d/GEEyeTargets.mm
      # Phase 6 M5 (round 49): vp3d.* -> 3D state, the settings sheet's state,
      # the bridge's `3d settings` (the rows themselves are in GESettings.m).
      - path: vision3d/GEVisionSettings.m
      # R9A-5: the same four files beside the exe as the iOS target.
      - path: ../tools/gamecontrollerdb.txt
        buildPhase: resources
      - path: ../tools/gamecontrollerdefault.txt
        buildPhase: resources
      - path: ../tools/midas_ini_help.txt
        buildPhase: resources
      - path: ../tools/shaders_base.txt
        buildPhase: resources
    settings:
      base:
        SDKROOT: xros
        TARGETED_DEVICE_FAMILY: "7"
        # The ANGLE xrOS slices are minos 26.0 (Chromium's libclang_rt.xros.a);
        # nothing on the visionOS side can target lower.
        XROS_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.rebelancap.projectmidas
        PRODUCT_NAME: ProjectMidas
        INFOPLIST_FILE: ios/Info-visionos.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "GE_MARKETING_VERSION"
        CURRENT_PROJECT_VERSION: "GE_BUILD_NUMBER"
        # build-visionos-sim vs build-visionos-device, by the SDK in use.
        GE_SLICE: device
        GE_SLICE[sdk=xrsimulator*]: sim
        # Phase 6 (round 45): GE_VISION_3D=1 on top of the inherited GE_PUBLIC;
        # the Swift half of the 3D mode (SWIFT_VERSION is required the moment a
        # .swift file is in a target; the bridging header is how
        # GEVisionApp.swift sees the ObjC shell). THIS target only - the iOS
        # target never compiles a line of Swift.
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) GE_VISION_3D=1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: vision3d/ge-vision-bridging.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/vision3d"
          # round 46: EGL/eglext_angle.h + GLES3 for GEEyeTargets.mm only
          - "$(SRCROOT)/../work/angle-include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../work/deps-$(PLATFORM_NAME)/lib"
          - "$(SRCROOT)/../build-visionos-$(GE_SLICE)"
        OTHER_LDFLAGS: "-lmidas -lSDL2 -lz -lc++"
    dependencies:
      - sdk: UIKit.framework
      # Its own pair of xcframeworks (xros + xrsimulator slices), so the iOS
      # target's embed phase is byte-for-byte what it was (D-341).
      - framework: ../work/angle-xcframeworks-visionos/libGLESv2.xcframework
        embed: true
        codeSign: true
      - framework: ../work/angle-xcframeworks-visionos/libEGL.xcframework
        embed: true
        codeSign: true
      # NO OpenGLES.framework: it does not exist on visionOS. The iOS target
      # links it only for SDL2's EAGL references; the xrOS SDL2 is built with
      # SDL_OPENGLES=OFF and has none (scripts/build-sdl2-visionos.sh).
      # No CoreBluetooth either: SDL_HIDAPI is OFF in the xrOS SDL2, which is
      # the only thing that ever touched it.
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMotion.framework
      - sdk: GameController.framework
      - sdk: Foundation.framework
      - sdk: UniformTypeIdentifiers.framework
      # Phase 6 (round 45): CompositorServices vends the per-eye drawables,
      # ARKit the device anchor the compositor reprojects with, SwiftUI is this
      # target's app entry. None of the three is in the iOS target.
      - sdk: CompositorServices.framework
      - sdk: ARKit.framework
      - sdk: SwiftUI.framework
